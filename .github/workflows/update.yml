name: Update matchup charts

on:
  # Every day at 5:00am US Eastern. GitHub schedules run in UTC with no daylight saving, so the
  # slot is listed for both EDT (UTC-4) and EST (UTC-5); the "when" job skips the one that doesn't match.
  schedule:
    - cron: "0 9 * * *"    # 5am EDT
    - cron: "0 10 * * *"   # 5am EST
  workflow_dispatch:
    inputs:
      week:
        description: "Force a week number (leave blank for the upcoming week)"
        required: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Hours behind UTC in New York right now: 4 during daylight saving, 5 otherwise.
          offset=$(TZ=America/New_York date +%z | sed 's/^-0*//;s/00$//')
          case "$offset:$SCHEDULE" in
            "4:0 9 * * *"|"5:0 10 * * *") go=true ;;
            *) go=false ;;
          esac
          echo "New York is UTC-$offset; schedule '$SCHEDULE' -> go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build charts
        run: python build.py ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
