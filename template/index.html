<title>Weekly Matchup Charts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one scoreboard-style column. Header, then controls, then the color-scaled table, then notes. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #142033;
  --muted: #5b6780;
  --line: #d9dfea;
  --accent: #1f4fa8;
  --head: #a4c2f4;        /* the header blue from the original sheets */
  --head-ink: #0f1d33;
  --bye: #b7e1cd;
  --chip: #e6ebf4;
  --cell-ink: #13202f;    /* text on colored cells, both themes */
  --win: #2f9e6b;         /* start/sit: the better side */
  --toss: #e0a43a;        /* start/sit: too close to call */
  --warn: #f6c75f;        /* questionable / doubtful */
  --bad: #c4483d;         /* out / bye */
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1420; --surface: #151d2c; --ink: #e6ecf6; --muted: #98a4ba; --line: #27324a;
    --accent: #8fb3ff; --head: #2c4a80; --head-ink: #eaf1ff; --bye: #2f5a48; --chip: #1f2a3e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1420; --surface: #151d2c; --ink: #e6ecf6; --muted: #98a4ba; --line: #27324a;
  --accent: #8fb3ff; --head: #2c4a80; --head-ink: #eaf1ff; --bye: #2f5a48; --chip: #1f2a3e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
  display: grid; gap: 20px;
}
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-size: 15px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 54px); line-height: .95; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button {
  font: 700 16px/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
  border: 0; background: transparent; color: var(--muted); padding: 9px 14px; border-radius: 6px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
.seg button:focus-visible, input:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pos button { font-size: 20px; padding: 9px 18px; }
#search {
  flex: 1 1 180px; min-width: 0; max-width: 280px; font: inherit; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.legend { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.legend .bar { width: 160px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #e67c73, #f6b26b, #57bb8a); }

.table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { background: var(--head); color: var(--head-ink); position: sticky; top: 0; z-index: 1; }
th button {
  all: unset; cursor: pointer; font: 700 14px/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase;
}
th button[data-dir]::after { content: attr(data-dir); margin-left: 4px; font-size: 11px; }
td { font-weight: 600; }
td.player, th.player { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
th.player { background: var(--head); z-index: 2; }
td.player { min-width: 170px; }
.names { font-weight: 700; }
.team { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
td.opp { font-weight: 700; }
.kick { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
td.scale { color: var(--cell-ink); }
td.rank { font-family: var(--display); font-size: 19px; font-weight: 800; }
td.pa small { font-weight: 500; opacity: .8; margin-left: 4px; }
tr.bye td { background: var(--bye); color: var(--ink); }
tr.bye td.player { background: var(--bye); }
tr.dim { display: none; }
tbody tr:hover td.player:not(.byecell) { box-shadow: inset 3px 0 0 var(--accent); }

.downloads { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.downloads a { color: var(--accent); font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 6px; }
.notes { color: var(--muted); font-size: 13px; display: grid; gap: 4px; max-width: 70ch; }
.notes p { margin: 0; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.view { display: grid; gap: 20px; }
.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--line); padding-bottom: 12px; }
.views { display: flex; gap: 4px; }
.views a {
  font: 800 19px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; text-decoration: none;
  color: var(--muted); padding: 10px 14px; border-radius: 8px;
}
.views a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.views a:focus-visible, .swap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pickers { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
.picker { display: grid; gap: 6px; min-width: 0; }
.picker label { font: 700 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.picker input { font: 600 16px/1.2 var(--body); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.picker input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.swap { font-size: 20px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.example { margin: -8px 0 0; color: var(--muted); font-size: 13px; }

.verdict { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--win); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; }
.verdict.toss { border-left-color: var(--toss); }
.verdict.none { border-left-color: var(--line); }
.verdict .call { font: 800 clamp(26px, 4.5vw, 36px)/1 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.verdict .margin { color: var(--muted); font-weight: 600; margin: 0; }
.verdict ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; }

table.cmp th, table.cmp td { white-space: normal; }
table.cmp td { width: 36%; font-size: 16px; }
table.cmp th.metric { text-align: left; background: var(--surface); color: var(--muted); font: 600 14px/1.25 var(--body); position: static; width: 28%; }
table.cmp tr.group th { background: var(--chip); color: var(--ink); font: 700 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; text-align: left; position: static; }
table.cmp tr.who td { font: 800 22px/1.1 var(--display); text-transform: uppercase; }
table.cmp tr.who .team { display: block; font: 600 13px/1.3 var(--body); text-transform: none; margin-top: 4px; }
table.cmp tr.proj td { font: 800 30px/1 var(--display); }
table.cmp td.edge { box-shadow: inset 0 0 0 2px var(--win); }
table.cmp td.scale.edge { box-shadow: inset 0 0 0 3px var(--ink); }
table.cmp .sub2 { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; }
table.cmp td.scale .sub2 { color: var(--cell-ink); opacity: .75; }
.badge { display: inline-block; font: 700 12px/1 var(--body); padding: 4px 7px; border-radius: 4px; background: var(--chip); color: var(--ink); }
.badge.out { background: var(--bad); color: #fff; }
.badge.q { background: var(--warn); color: var(--cell-ink); }
.badge.ok { background: var(--chip); color: var(--muted); }

@media (max-width: 520px) {
  .pos button { padding: 8px 13px; font-size: 18px; } td.player { min-width: 130px; }
  .pickers { grid-template-columns: 1fr; } .swap { justify-self: center; transform: rotate(90deg); }
  table.cmp td { font-size: 14px; } table.cmp tr.who td { font-size: 18px; } table.cmp tr.proj td { font-size: 24px; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">NFL Matchups</div>
    <h1 id="title">Matchup Charts</h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="topbar">
    <div class="views" role="group" aria-label="View" id="viewNav">
      <a href="#qb" data-view="charts">Matchup Charts</a>
      <a href="#start-sit" data-view="ss">Start / Sit</a>
    </div>
    <div class="seg" role="group" aria-label="Scoring" id="fmtSeg"></div>
  </nav>

  <section id="chartsView" class="view">
    <div class="controls">
      <div class="seg pos" role="group" aria-label="Position" id="posSeg"></div>
      <input id="search" type="search" placeholder="Find a player or team" aria-label="Find a player or team">
    </div>

    <div class="legend"><span>Tough matchup</span><span class="bar" aria-hidden="true"></span><span>Great matchup</span><span id="rankNote"></span></div>

    <div class="table-box"><table id="tbl"><thead></thead><tbody></tbody></table></div>

    <div class="downloads" id="downloads" hidden><span>Download spreadsheets:</span></div>

    <div class="notes" id="notes"></div>
  </section>

  <section id="ssView" class="view" hidden>
    <div class="pickers">
      <div class="picker">
        <label for="pickA">Player 1</label>
        <input id="pickA" type="search" list="playerList" placeholder="Type a name" autocomplete="off">
      </div>
      <button type="button" id="swap" class="swap" aria-label="Swap players" title="Swap players">⇄</button>
      <div class="picker">
        <label for="pickB">Player 2</label>
        <input id="pickB" type="search" list="playerList" placeholder="Type a name" autocomplete="off">
      </div>
      <datalist id="playerList"></datalist>
    </div>
    <p class="example" id="ssExample" hidden>Example comparison. Type any two players above to compare your own.</p>

    <div id="verdict" class="verdict" aria-live="polite"></div>

    <div class="table-box"><table id="cmp" class="cmp"><tbody></tbody></table></div>

    <div class="notes" id="ssNotes"></div>
  </section>
</div>

<script>
const DATA = /*__DATA__*/null;
const SHOW_DOWNLOADS = /*__DOWNLOADS__*/true;
const POS = ["QB", "RB", "WR", "TE"];
const POS_NAME = { QB: "quarterbacks", RB: "running backs", WR: "wide receivers", TE: "tight ends" };
const state = { pos: "QB", fmt: "ppr", sort: null, q: "", view: "charts" };
const RECENT = 3;
try { const f = localStorage.getItem("mc-fmt"); if (f && DATA && DATA.formats[f]) state.fmt = f; } catch (e) {}

// Three-stop color scale, like the Google Sheets color scale the original charts used.
const RED = [230, 124, 115], ORANGE = [246, 178, 107], YELLOW = [255, 217, 102], GREEN = [87, 187, 138];
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function scaleColor(v, min, mid, max, midColor) {
  let c;
  if (max === min) c = midColor;
  else if (v <= mid) c = mix(RED, midColor, mid === min ? 1 : (v - min) / (mid - min));
  else c = mix(midColor, GREEN, max === mid ? 1 : (v - mid) / (max - mid));
  return `rgb(${c.join(",")})`;
}
function median(arr) { const s = [...arr].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function stops(vals) { return [Math.min(...vals), median(vals), Math.max(...vals)]; }
function fmtNum(v, dp) { return Number(v).toFixed(dp); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function kickLabel(k) {
  if (!k) return "";
  const d = new Date(k.slice(0, 10) + "T12:00:00");
  return isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short" });
}

function columns(pos) {
  const block = DATA.positions[pos];
  return [
    { key: "player", label: pos, cls: "player" },
    { key: "opp", label: "Opp", cls: "opp" },
    { key: "rank", label: "Rank", cls: "rank" },
    { key: "fppg", label: "FPPG", cls: "fppg" },
    { key: "pa", label: `PA Wk ${DATA.prevWeek}`, cls: "pa" },
    ...block.columns.map(c => ({ key: c.key, label: c.label, dp: c.dp, stat: true })),
  ];
}

function value(row, key) {
  const d = row.def, f = state.fmt;
  switch (key) {
    case "player": return row.players.join("/");
    case "opp": return row.opp;
    case "rank": return d.rank[f];
    case "fppg": return d.fppg[f];
    case "pa": return d.pa ? d.pa.pts[f] : -999;
    default: return d.stats[key];
  }
}

function render() {
  const pos = state.pos, f = state.fmt, cols = columns(pos);
  const rows = DATA.positions[pos].rows;
  const playing = rows.filter(r => !r.bye), byes = rows.filter(r => r.bye);
  const sort = state.sort || { key: "rank", dir: -1 };
  playing.sort((a, b) => {
    const va = value(a, sort.key), vb = value(b, sort.key);
    const c = typeof va === "string" ? va.localeCompare(vb) : va - vb;
    return c * sort.dir || value(b, "fppg") - value(a, "fppg");
  });

  // Color stops per column, computed across the defenses that play this week.
  const st = {};
  st.rank = [1, 16.5, 32];
  st.fppg = stops(playing.map(r => r.def.fppg[f]));
  const paVals = playing.filter(r => r.def.pa).map(r => r.def.pa.pts[f]);
  st.pa = paVals.length ? stops(paVals) : [0, 0, 0];
  cols.filter(c => c.stat).forEach(c => { st[c.key] = stops(playing.map(r => r.def.stats[c.key])); });

  const thead = document.querySelector("#tbl thead");
  thead.innerHTML = "<tr>" + cols.map(c => {
    const dir = state.sort && state.sort.key === c.key ? (state.sort.dir > 0 ? "▲" : "▼") : null;
    return `<th class="${c.cls || ""}" scope="col"><button type="button" data-key="${c.key}"${dir ? ` data-dir="${dir}"` : ""}>${esc(c.label)}</button></th>`;
  }).join("") + "</tr>";

  const tbody = document.querySelector("#tbl tbody");
  const html = [];
  const q = state.q.trim().toLowerCase();
  const hit = r => !q || r.players.join(" ").toLowerCase().includes(q) || r.team.toLowerCase() === q ||
    (r.opp && r.opp.toLowerCase() === q);
  for (const r of playing) {
    const d = r.def;
    const cells = [];
    cells.push(`<td class="player"><span class="names">${esc(r.players.join(" / "))}</span> <span class="team">${esc(r.team)}</span></td>`);
    cells.push(`<td class="opp">${r.away ? "@" : ""}${esc(r.opp)}<span class="kick">${esc(kickLabel(r.kick))}</span></td>`);
    cells.push(`<td class="scale rank" style="background:${scaleColor(d.rank[f], ...st.rank, ORANGE)}">${d.rank[f]}</td>`);
    cells.push(`<td class="scale" style="background:${scaleColor(d.fppg[f], ...st.fppg, ORANGE)}">${fmtNum(d.fppg[f], 1)}</td>`);
    if (d.pa) cells.push(`<td class="scale pa" style="background:${scaleColor(d.pa.pts[f], ...st.pa, ORANGE)}">${fmtNum(d.pa.pts[f], 1)}<small>(${esc(d.pa.who)})</small></td>`);
    else cells.push(`<td class="pa">BYE</td>`);
    for (const c of cols.filter(c => c.stat)) {
      const v = d.stats[c.key];
      cells.push(`<td class="scale" style="background:${scaleColor(v, ...st[c.key], YELLOW)}">${fmtNum(v, c.dp)}</td>`);
    }
    html.push(`<tr class="${hit(r) ? "" : "dim"}">${cells.join("")}</tr>`);
  }
  for (const r of byes) {
    html.push(`<tr class="bye ${hit(r) ? "" : "dim"}"><td class="player byecell"><span class="names">${esc(r.players.join(" / "))}</span> <span class="team">${esc(r.team)}</span></td>` +
      `<td>BYE</td><td>BYE</td><td>BYE</td><td>BYE</td>${cols.filter(c => c.stat).map(() => "<td></td>").join("")}</tr>`);
  }
  tbody.innerHTML = html.join("") || `<tr><td class="empty" colspan="${cols.length}">No games found for this week.</td></tr>`;

  document.querySelectorAll("#posSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.pos === pos));
  document.querySelectorAll("#fmtSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.fmt === f));
  const fl = DATA.formats[f];
  document.getElementById("rankNote").textContent = `Rank 1 = fewest ${fl} points allowed to ${POS_NAME[pos]}, 32 = most`;
  if (state.view === "charts") document.getElementById("title").textContent = `Week ${DATA.week} ${pos} Matchups`;
  document.getElementById("notes").innerHTML = [
    `Every stat is what the <strong>opponent's defense</strong> has allowed per game to ${POS_NAME[pos]} this season, through Week ${DATA.statsThrough}.`,
    `FPPG is ${fl} fantasy points allowed per game. PA Wk ${DATA.prevWeek} is what that defense gave up to ${POS_NAME[pos]} last week, and who scored the most.`,
    pos === "QB" ? "Passing numbers count every pass thrown against the defense." :
      pos === "WR" ? "Up to three receivers from the current depth chart are listed per team." :
      "A second player is listed when he is scoring at least 60% as much as the starter over the last three games.",
    `Scoring: 4 pt passing TD, 1 pt per 25 pass yds, 1 pt per 10 rush/rec yds, 6 pt rush/rec TD, −2 per INT or fumble lost${f === "ppr" ? ", 1 per catch" : f === "half" ? ", 0.5 per catch" : ""}.`,
    `Data: <a href="https://github.com/nflverse/nflverse-data" target="_blank" rel="noopener">nflverse</a> weekly stats, schedule and depth charts. Click any column header to sort.`,
  ].map(s => `<p>${s}</p>`).join("");
}

function setPos(p) { state.pos = p; state.sort = null; render(); }

function showView(v) {
  state.view = v;
  document.getElementById("chartsView").hidden = v !== "charts";
  document.getElementById("ssView").hidden = v !== "ss";
  document.querySelectorAll("#viewNav a").forEach(a => {
    if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.querySelector('#viewNav a[data-view="charts"]').href = "#" + state.pos.toLowerCase();
  if (v === "ss") renderSS();
}

// ------------------------------------------------------------------ start / sit
// Projection = the player's own scoring (60% season, 40% last 3 games), scaled by how much the
// opponent allows to his position compared with the league average. The matchup effect is
// halved and capped at ±25%, because a defense's numbers over ~10 games are noisy.
const USAGE_LABEL = {
  att: "Pass attempts", pyd: "Pass yards", ptd: "Pass TDs", int: "Interceptions",
  car: "Carries", ryd: "Rush yards", rtd: "Rush TDs",
  tgt: "Targets", rec: "Catches", recyd: "Rec yards", rectd: "Rec TDs",
};
const USAGE_ORDER = ["att", "pyd", "ptd", "int", "car", "ryd", "rtd", "tgt", "rec", "recyd", "rectd"];
const LOWER_IS_BETTER = new Set(["int"]);
const ss = { a: null, b: null, example: false };
const byId = new Map();
const byLabel = new Map();

function pts(o, f) { return f === "half" ? (o.ppr + o.std) / 2 : o[f]; }
function playerLabel(p) { return `${p.name} (${p.pos}, ${p.team})`; }
function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function unavailable(p) {
  if (p.bye) return "on bye";
  if (p.inj && /^(out|ir|pup)/i.test(p.inj.status)) return "ruled out";
  return null;
}
function matchupWord(rank) { return rank >= 25 ? "great" : rank >= 17 ? "good" : rank >= 9 ? "tough" : "very tough"; }

function project(p, f) {
  const season = pts(p.ppg, f), recent = pts(p.l3, f);
  const base = p.g >= 3 ? 0.6 * season + 0.4 * recent : season;
  if (p.bye) return { base, factor: 1, proj: 0 };
  const d = DATA.defenses[p.pos][p.opp], avg = DATA.leagueAvg[p.pos][f];
  const raw = avg ? d.fppg[f] / avg : 1;
  const factor = Math.min(1.25, Math.max(0.75, 1 + 0.5 * (raw - 1)));
  return { base, factor, proj: base * factor, def: d };
}

function initSS() {
  const list = document.getElementById("playerList");
  const opts = [];
  for (const p of DATA.players) {
    const label = playerLabel(p);
    byId.set(p.id, p); byLabel.set(label.toLowerCase(), p);
    opts.push(`<option value="${esc(label)}"></option>`);
  }
  list.innerHTML = opts.join("");
  try {
    const saved = JSON.parse(localStorage.getItem("mc-ss") || "null");
    if (saved) { ss.a = byId.get(saved.a) || null; ss.b = byId.get(saved.b) || null; }
  } catch (e) {}
  if (!ss.a && !ss.b) {
    // Open on a realistic close call: two RBs next to each other in the season scoring order.
    const rbs = DATA.players.filter(p => p.pos === "RB" && !unavailable(p) && p.g >= 4);
    if (rbs.length > 12) { ss.a = rbs[10]; ss.b = rbs[11]; ss.example = true; }
  }
  const inA = document.getElementById("pickA"), inB = document.getElementById("pickB");
  const sync = () => { inA.value = ss.a ? playerLabel(ss.a) : ""; inB.value = ss.b ? playerLabel(ss.b) : ""; };
  sync();
  const pick = (slot, input) => () => {
    const p = byLabel.get(input.value.trim().toLowerCase());
    if (p) { ss[slot] = p; ss.example = false; save(); renderSS(); }
    else if (!input.value.trim()) { ss[slot] = null; ss.example = false; save(); renderSS(); }
  };
  inA.addEventListener("input", pick("a", inA)); inA.addEventListener("change", pick("a", inA));
  inB.addEventListener("input", pick("b", inB)); inB.addEventListener("change", pick("b", inB));
  document.getElementById("swap").addEventListener("click", () => { [ss.a, ss.b] = [ss.b, ss.a]; sync(); save(); renderSS(); });
  function save() { try { localStorage.setItem("mc-ss", JSON.stringify({ a: ss.a && ss.a.id, b: ss.b && ss.b.id })); } catch (e) {} }
}

function verdictFor(A, B, f) {
  const pa = project(A, f), pb = project(B, f);
  const ua = unavailable(A), ub = unavailable(B);
  const reasons = [];
  if (ua && ub) return { cls: "none", call: "Neither can play", margin: `${A.name} is ${ua} and ${B.name} is ${ub}.`, reasons, pa, pb };
  if (ua || ub) {
    const [W, why, L] = ua ? [B, ua, A] : [A, ub, B];
    return { cls: "", call: `Start ${W.name}`, margin: `${L.name} is ${why} this week.`, reasons, pa, pb, winner: W };
  }
  const W = pa.proj >= pb.proj ? A : B, L = W === A ? B : A;
  const pw = W === A ? pa : pb, pl = W === A ? pb : pa;
  const diff = pw.proj - pl.proj;
  const toss = diff < 1;
  // Reasons, in plain language.
  const rw = pw.def.rank[f], rl = pl.def.rank[f];
  const fl = DATA.formats[f];
  if (Math.abs(rw - rl) >= 4) {
    const better = rw > rl ? W : L, br = Math.max(rw, rl), wr = Math.min(rw, rl);
    const bp = better === W ? W : L, other = better === W ? L : W;
    reasons.push(`${bp.name} has the better matchup: ${bp.opp} is ${ordinal(33 - br)} most generous to ${bp.pos}s, while ${other.opp} is ${ordinal(33 - wr)} against ${other.pos}s.`);
  } else {
    reasons.push(`Similar matchups: ${W.opp} ranks ${rw} and ${L.opp} ranks ${rl} of 32 in ${fl} points allowed to the position.`);
  }
  const bw = pw.base, bl = pl.base;
  const saidForm = new Set();
  if (Math.abs(bw - bl) >= 1) {
    const hi = bw > bl ? W : L, lo = hi === W ? L : W;
    const hs = pts(hi.ppg, f), hr = pts(hi.l3, f), ls = pts(lo.ppg, f), lr = pts(lo.l3, f);
    if (hs >= ls && hr >= lr) {
      reasons.push(`${hi.name} scores more on his own: ${hs.toFixed(1)} per game this season and ${hr.toFixed(1)} over his last ${Math.min(RECENT, hi.g)}, vs ${ls.toFixed(1)} and ${lr.toFixed(1)}.`);
    } else if (hr > lr) {
      reasons.push(`${hi.name} is hotter lately: ${hr.toFixed(1)} per game over his last ${Math.min(RECENT, hi.g)} vs ${lr.toFixed(1)}, even though ${lo.name}'s season average is higher (${ls.toFixed(1)} vs ${hs.toFixed(1)}).`);
      saidForm.add(hi);
    } else {
      reasons.push(`${hi.name} has the higher season average (${hs.toFixed(1)} vs ${ls.toFixed(1)}), though ${lo.name} has been better over the last ${RECENT} games (${lr.toFixed(1)} vs ${hr.toFixed(1)}).`);
      saidForm.add(lo);
    }
  }
  for (const p of [A, B]) {
    if (saidForm.has(p)) continue;
    const s = pts(p.ppg, f), r = pts(p.l3, f);
    if (p.g >= 4 && r >= s * 1.3 && r - s >= 3) reasons.push(`${p.name} is trending up: ${r.toFixed(1)} per game over his last 3.`);
    if (p.g >= 4 && r <= s * 0.7 && s - r >= 3) reasons.push(`${p.name} is trending down: ${r.toFixed(1)} per game over his last 3.`);
  }
  for (const p of [A, B]) {
    if (p.inj) reasons.push(`${p.name} is ${p.inj.status.toLowerCase()}${p.inj.injury ? ` (${p.inj.injury.toLowerCase()})` : ""}. Check his status before kickoff.`);
  }
  let call = toss ? `Toss-up, lean ${W.name}` : `Start ${W.name}`;
  if (W.inj && /doubtful/i.test(W.inj.status) && !(L.inj && /doubtful/i.test(L.inj.status))) {
    return { cls: "", call: `Start ${L.name}`, margin: `${W.name} projects higher but is doubtful to play.`, reasons, pa, pb, winner: L };
  }
  return {
    cls: toss ? "toss" : "", call, winner: W, reasons, pa, pb,
    margin: `${pw.proj.toFixed(1)} vs ${pl.proj.toFixed(1)} projected ${fl} points${toss ? ". Too close to call on numbers alone." : ` (+${diff.toFixed(1)})`}`,
  };
}

function renderSS() {
  const f = state.fmt, A = ss.a, B = ss.b;
  document.getElementById("title").textContent = `Week ${DATA.week} Start / Sit`;
  document.getElementById("ssExample").hidden = !ss.example;
  const vEl = document.getElementById("verdict"), tb = document.querySelector("#cmp tbody");
  if (!A || !B) {
    vEl.className = "verdict none";
    vEl.innerHTML = `<p class="call">Pick two players</p><p class="margin">Type a name in each box. Any positions work, so you can settle a flex spot too.</p>`;
    tb.innerHTML = "";
    renderSSNotes(f);
    return;
  }
  const v = verdictFor(A, B, f);
  vEl.className = "verdict " + v.cls;
  vEl.innerHTML = `<p class="call">${esc(v.call)}</p><p class="margin">${esc(v.margin)}</p>` +
    (v.reasons.length ? `<ul>${v.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "");

  const rows = [];
  const P = [A, B], proj = [v.pa, v.pb];
  const edgeIdx = (vals, lowerBetter) => {
    if (vals.some(x => x == null || Number.isNaN(x))) return -1;
    if (vals[0] === vals[1]) return -1;
    return (lowerBetter ? vals[0] < vals[1] : vals[0] > vals[1]) ? 0 : 1;
  };
  const row = (label, cells, edge = -1) => rows.push(`<tr><th class="metric" scope="row">${label}</th>${cells.map((c, i) => c.replace("<td", `<td${i === edge ? ' data-edge="1"' : ""}`)).join("")}</tr>`);
  const group = t => rows.push(`<tr class="group"><th colspan="3" scope="colgroup">${t}</th></tr>`);

  rows.push(`<tr class="who"><th class="metric" scope="row"></th>${P.map(p => `<td>${esc(p.name)}<span class="team">${p.pos} · ${esc(p.team)}${p.depth ? ` · ${p.pos}${p.depth} on depth chart` : ""}</span></td>`).join("")}</tr>`);
  row("Projected points", P.map((p, i) => `<td>${unavailable(p) ? "—" : proj[i].proj.toFixed(1)}</td>`),
    v.winner ? P.indexOf(v.winner) : -1);
  rows[rows.length - 1] = rows[rows.length - 1].replace("<tr>", '<tr class="proj">');

  group(`Week ${DATA.week} matchup`);
  row("Opponent", P.map(p => `<td>${p.bye ? "BYE" : `${p.away ? "@" : ""}${esc(p.opp)}<span class="sub2">${esc(kickLabel(p.kick))}</span>`}</td>`));
  row("Status", P.map(p => {
    if (p.bye) return `<td><span class="badge out">Bye</span></td>`;
    if (!p.inj) return `<td><span class="badge ok">No injury listed</span></td>`;
    const out = /^(out|ir|pup)/i.test(p.inj.status);
    return `<td><span class="badge ${out ? "out" : "q"}">${esc(p.inj.status)}</span>${p.inj.injury ? `<span class="sub2">${esc(p.inj.injury)}</span>` : ""}</td>`;
  }));
  const ranks = P.map(p => p.bye ? null : DATA.defenses[p.pos][p.opp].rank[f]);
  row("Matchup rank", P.map((p, i) => ranks[i] == null ? "<td>—</td>" :
    `<td class="scale" style="background:${scaleColor(ranks[i], 1, 16.5, 32, ORANGE)}">${ranks[i]} of 32<span class="sub2">${matchupWord(ranks[i])} for ${p.pos}s</span></td>`), edgeIdx(ranks));
  const allowed = P.map(p => p.bye ? null : DATA.defenses[p.pos][p.opp].fppg[f]);
  row(`${DATA.formats[f]} pts allowed / game`, P.map((p, i) => allowed[i] == null ? "<td>—</td>" :
    `<td>${allowed[i].toFixed(1)}<span class="sub2">league avg ${DATA.leagueAvg[p.pos][f].toFixed(1)} to ${p.pos}s</span></td>`));
  const boosts = P.map((p, i) => p.bye ? null : (proj[i].factor - 1) * 100);
  row("Matchup adjustment", P.map((p, i) => boosts[i] == null ? "<td>—</td>" :
    `<td>${boosts[i] >= 0 ? "+" : "−"}${Math.abs(boosts[i]).toFixed(0)}%</td>`), edgeIdx(boosts));

  group("Production");
  const sp = P.map(p => pts(p.ppg, f)), l3 = P.map(p => pts(p.l3, f));
  row(`${DATA.formats[f]} pts / game`, P.map((p, i) => `<td>${sp[i].toFixed(1)}<span class="sub2">${p.g} game${p.g === 1 ? "" : "s"}</span></td>`), edgeIdx(sp));
  row(`Last ${RECENT} games`, P.map((p, i) => `<td>${l3[i].toFixed(1)}</td>`), edgeIdx(l3));

  group("Usage per game (season · last 3)");
  const keys = USAGE_ORDER.filter(k => k in A.use || k in B.use);
  for (const k of keys) {
    const vals = P.map(p => (k in p.use ? p.use[k] : null));
    row(USAGE_LABEL[k], P.map(p => k in p.use
      ? `<td>${p.use[k].toFixed(1)}<span class="sub2">last 3: ${p.l3use[k].toFixed(1)}</span></td>` : "<td>—</td>"),
      A.pos === B.pos ? edgeIdx(vals, LOWER_IS_BETTER.has(k)) : -1);
  }
  tb.innerHTML = rows.join("").replaceAll('<td data-edge="1" class="', '<td class="edge ').replaceAll('<td data-edge="1"', '<td class="edge"');
  renderSSNotes(f);
}

function renderSSNotes(f) {
  document.getElementById("ssNotes").innerHTML = [
    `<strong>How the projection works:</strong> each player's ${DATA.formats[f]} points per game (60% season average, 40% last ${RECENT} games), adjusted for how many points this week's opponent allows to his position compared with the league average.`,
    "The matchup adjustment is halved and capped at ±25%, because a defense's numbers over ten or so games are noisy. A difference under 1 point is called a toss-up.",
    `Injury status comes from the official Week ${DATA.week} injury report and updates each morning. Outlined cells show who has the edge on that line.`,
    "This is a numbers-based starting point. Weather, game script and late news are not included.",
  ].map(s => `<p>${s}</p>`).join("");
}

function init() {
  if (!DATA) { document.querySelector(".table-box").innerHTML = '<p class="empty">No data yet. Run build.py to generate this week\'s charts.</p>'; return; }
  const upd = new Date(DATA.updated);
  document.getElementById("eyebrow").textContent = `${DATA.season} NFL season · Week ${DATA.week}`;
  document.getElementById("sub").textContent =
    `Defense stats through Week ${DATA.statsThrough}. Updated ${upd.toLocaleDateString(undefined, { month: "short", day: "numeric" })} at ${upd.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}.`;
  document.getElementById("posSeg").innerHTML = POS.map(p => `<button type="button" data-pos="${p}">${p}</button>`).join("");
  document.getElementById("fmtSeg").innerHTML = Object.entries(DATA.formats).map(([k, v]) => `<button type="button" data-fmt="${k}">${v}</button>`).join("");
  document.getElementById("posSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (location.hash !== "#" + b.dataset.pos.toLowerCase()) location.hash = b.dataset.pos.toLowerCase(); else setPos(b.dataset.pos);
  });
  document.getElementById("fmtSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.fmt = b.dataset.fmt; try { localStorage.setItem("mc-fmt", state.fmt); } catch (err) {}
    state.view === "ss" ? renderSS() : render();
  });
  document.querySelector("#tbl thead").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const key = b.dataset.key;
    const cur = state.sort || { key: "rank", dir: -1 };
    state.sort = { key, dir: cur.key === key ? -cur.dir : (key === "player" || key === "opp" ? 1 : -1) };
    render();
  });
  document.getElementById("search").addEventListener("input", e => { state.q = e.target.value; render(); });
  if (SHOW_DOWNLOADS) {
    const box = document.getElementById("downloads");
    box.hidden = false;
    for (const label of Object.values(DATA.formats)) {
      const a = document.createElement("a");
      a.href = `Week_${DATA.week}_Matchups_${label.replace(/ /g, "_")}.xlsx`;
      a.textContent = `${label} (.xlsx)`;
      box.appendChild(a);
    }
  }
  initSS();
  const fromHash = () => {
    const h = location.hash.slice(1);
    if (h === "start-sit") return showView("ss");
    showView("charts");
    setPos(POS.includes(h.toUpperCase()) ? h.toUpperCase() : "QB");
  };
  window.addEventListener("hashchange", fromHash);
  fromHash();
}
init();
</script>
