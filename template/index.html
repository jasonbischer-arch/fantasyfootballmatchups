<title>Weekly Matchup Charts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one scoreboard-style column. Header, then controls, then the color-scaled table, then notes. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #142033;
  --muted: #5b6780;
  --line: #d9dfea;
  --accent: #1f4fa8;
  --head: #a4c2f4;        /* the header blue from the original sheets */
  --head-ink: #0f1d33;
  --bye: #b7e1cd;
  --chip: #e6ebf4;
  --cell-ink: #13202f;    /* text on colored cells, both themes */
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1420; --surface: #151d2c; --ink: #e6ecf6; --muted: #98a4ba; --line: #27324a;
    --accent: #8fb3ff; --head: #2c4a80; --head-ink: #eaf1ff; --bye: #2f5a48; --chip: #1f2a3e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1420; --surface: #151d2c; --ink: #e6ecf6; --muted: #98a4ba; --line: #27324a;
  --accent: #8fb3ff; --head: #2c4a80; --head-ink: #eaf1ff; --bye: #2f5a48; --chip: #1f2a3e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
  display: grid; gap: 20px;
}
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-size: 15px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 54px); line-height: .95; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button {
  font: 700 16px/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
  border: 0; background: transparent; color: var(--muted); padding: 9px 14px; border-radius: 6px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
.seg button:focus-visible, input:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pos button { font-size: 20px; padding: 9px 18px; }
#search {
  flex: 1 1 180px; min-width: 0; max-width: 280px; font: inherit; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.legend { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.legend .bar { width: 160px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #e67c73, #f6b26b, #57bb8a); }

.table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { background: var(--head); color: var(--head-ink); position: sticky; top: 0; z-index: 1; }
th button {
  all: unset; cursor: pointer; font: 700 14px/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase;
}
th button[data-dir]::after { content: attr(data-dir); margin-left: 4px; font-size: 11px; }
td { font-weight: 600; }
td.player, th.player { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
th.player { background: var(--head); z-index: 2; }
td.player { min-width: 170px; }
.names { font-weight: 700; }
.team { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
td.opp { font-weight: 700; }
.kick { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
td.scale { color: var(--cell-ink); }
td.rank { font-family: var(--display); font-size: 19px; font-weight: 800; }
td.pa small { font-weight: 500; opacity: .8; margin-left: 4px; }
tr.bye td { background: var(--bye); color: var(--ink); }
tr.bye td.player { background: var(--bye); }
tr.dim { display: none; }
tbody tr:hover td.player:not(.byecell) { box-shadow: inset 3px 0 0 var(--accent); }

.downloads { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.downloads a { color: var(--accent); font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 6px; }
.notes { color: var(--muted); font-size: 13px; display: grid; gap: 4px; max-width: 70ch; }
.notes p { margin: 0; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
@media (max-width: 520px) { .pos button { padding: 8px 13px; font-size: 18px; } td.player { min-width: 130px; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">NFL Matchups</div>
    <h1 id="title">Matchup Charts</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="controls">
    <div class="seg pos" role="group" aria-label="Position" id="posSeg"></div>
    <div class="seg" role="group" aria-label="Scoring" id="fmtSeg"></div>
    <input id="search" type="search" placeholder="Find a player or team" aria-label="Find a player or team">
  </div>

  <div class="legend"><span>Tough matchup</span><span class="bar" aria-hidden="true"></span><span>Great matchup</span><span id="rankNote"></span></div>

  <div class="table-box"><table id="tbl"><thead></thead><tbody></tbody></table></div>

  <div class="downloads" id="downloads" hidden><span>Download spreadsheets:</span></div>

  <div class="notes" id="notes"></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const SHOW_DOWNLOADS = /*__DOWNLOADS__*/true;
const POS = ["QB", "RB", "WR", "TE"];
const POS_NAME = { QB: "quarterbacks", RB: "running backs", WR: "wide receivers", TE: "tight ends" };
const state = { pos: "QB", fmt: "ppr", sort: null, q: "" };
try { const f = localStorage.getItem("mc-fmt"); if (f && DATA && DATA.formats[f]) state.fmt = f; } catch (e) {}

// Three-stop color scale, like the Google Sheets color scale the original charts used.
const RED = [230, 124, 115], ORANGE = [246, 178, 107], YELLOW = [255, 217, 102], GREEN = [87, 187, 138];
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function scaleColor(v, min, mid, max, midColor) {
  let c;
  if (max === min) c = midColor;
  else if (v <= mid) c = mix(RED, midColor, mid === min ? 1 : (v - min) / (mid - min));
  else c = mix(midColor, GREEN, max === mid ? 1 : (v - mid) / (max - mid));
  return `rgb(${c.join(",")})`;
}
function median(arr) { const s = [...arr].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function stops(vals) { return [Math.min(...vals), median(vals), Math.max(...vals)]; }
function fmtNum(v, dp) { return Number(v).toFixed(dp); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function kickLabel(k) {
  if (!k) return "";
  const d = new Date(k.slice(0, 10) + "T12:00:00");
  return isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short" });
}

function columns(pos) {
  const block = DATA.positions[pos];
  return [
    { key: "player", label: pos, cls: "player" },
    { key: "opp", label: "Opp", cls: "opp" },
    { key: "rank", label: "Rank", cls: "rank" },
    { key: "fppg", label: "FPPG", cls: "fppg" },
    { key: "pa", label: `PA Wk ${DATA.prevWeek}`, cls: "pa" },
    ...block.columns.map(c => ({ key: c.key, label: c.label, dp: c.dp, stat: true })),
  ];
}

function value(row, key) {
  const d = row.def, f = state.fmt;
  switch (key) {
    case "player": return row.players.join("/");
    case "opp": return row.opp;
    case "rank": return d.rank[f];
    case "fppg": return d.fppg[f];
    case "pa": return d.pa ? d.pa.pts[f] : -999;
    default: return d.stats[key];
  }
}

function render() {
  const pos = state.pos, f = state.fmt, cols = columns(pos);
  const rows = DATA.positions[pos].rows;
  const playing = rows.filter(r => !r.bye), byes = rows.filter(r => r.bye);
  const sort = state.sort || { key: "rank", dir: -1 };
  playing.sort((a, b) => {
    const va = value(a, sort.key), vb = value(b, sort.key);
    const c = typeof va === "string" ? va.localeCompare(vb) : va - vb;
    return c * sort.dir || value(b, "fppg") - value(a, "fppg");
  });

  // Color stops per column, computed across the defenses that play this week.
  const st = {};
  st.rank = [1, 16.5, 32];
  st.fppg = stops(playing.map(r => r.def.fppg[f]));
  const paVals = playing.filter(r => r.def.pa).map(r => r.def.pa.pts[f]);
  st.pa = paVals.length ? stops(paVals) : [0, 0, 0];
  cols.filter(c => c.stat).forEach(c => { st[c.key] = stops(playing.map(r => r.def.stats[c.key])); });

  const thead = document.querySelector("#tbl thead");
  thead.innerHTML = "<tr>" + cols.map(c => {
    const dir = state.sort && state.sort.key === c.key ? (state.sort.dir > 0 ? "▲" : "▼") : null;
    return `<th class="${c.cls || ""}" scope="col"><button type="button" data-key="${c.key}"${dir ? ` data-dir="${dir}"` : ""}>${esc(c.label)}</button></th>`;
  }).join("") + "</tr>";

  const tbody = document.querySelector("#tbl tbody");
  const html = [];
  const q = state.q.trim().toLowerCase();
  const hit = r => !q || r.players.join(" ").toLowerCase().includes(q) || r.team.toLowerCase() === q ||
    (r.opp && r.opp.toLowerCase() === q);
  for (const r of playing) {
    const d = r.def;
    const cells = [];
    cells.push(`<td class="player"><span class="names">${esc(r.players.join(" / "))}</span> <span class="team">${esc(r.team)}</span></td>`);
    cells.push(`<td class="opp">${r.away ? "@" : ""}${esc(r.opp)}<span class="kick">${esc(kickLabel(r.kick))}</span></td>`);
    cells.push(`<td class="scale rank" style="background:${scaleColor(d.rank[f], ...st.rank, ORANGE)}">${d.rank[f]}</td>`);
    cells.push(`<td class="scale" style="background:${scaleColor(d.fppg[f], ...st.fppg, ORANGE)}">${fmtNum(d.fppg[f], 1)}</td>`);
    if (d.pa) cells.push(`<td class="scale pa" style="background:${scaleColor(d.pa.pts[f], ...st.pa, ORANGE)}">${fmtNum(d.pa.pts[f], 1)}<small>(${esc(d.pa.who)})</small></td>`);
    else cells.push(`<td class="pa">BYE</td>`);
    for (const c of cols.filter(c => c.stat)) {
      const v = d.stats[c.key];
      cells.push(`<td class="scale" style="background:${scaleColor(v, ...st[c.key], YELLOW)}">${fmtNum(v, c.dp)}</td>`);
    }
    html.push(`<tr class="${hit(r) ? "" : "dim"}">${cells.join("")}</tr>`);
  }
  for (const r of byes) {
    html.push(`<tr class="bye ${hit(r) ? "" : "dim"}"><td class="player byecell"><span class="names">${esc(r.players.join(" / "))}</span> <span class="team">${esc(r.team)}</span></td>` +
      `<td>BYE</td><td>BYE</td><td>BYE</td><td>BYE</td>${cols.filter(c => c.stat).map(() => "<td></td>").join("")}</tr>`);
  }
  tbody.innerHTML = html.join("") || `<tr><td class="empty" colspan="${cols.length}">No games found for this week.</td></tr>`;

  document.querySelectorAll("#posSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.pos === pos));
  document.querySelectorAll("#fmtSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.fmt === f));
  const fl = DATA.formats[f];
  document.getElementById("rankNote").textContent = `Rank 1 = fewest ${fl} points allowed to ${POS_NAME[pos]}, 32 = most`;
  document.getElementById("title").textContent = `Week ${DATA.week} ${pos} Matchups`;
  document.getElementById("notes").innerHTML = [
    `Every stat is what the <strong>opponent's defense</strong> has allowed per game to ${POS_NAME[pos]} this season, through Week ${DATA.statsThrough}.`,
    `FPPG is ${fl} fantasy points allowed per game. PA Wk ${DATA.prevWeek} is what that defense gave up to ${POS_NAME[pos]} last week, and who scored the most.`,
    pos === "QB" ? "Passing numbers count every pass thrown against the defense." :
      pos === "WR" ? "Up to three receivers from the current depth chart are listed per team." :
      "A second player is listed when he is scoring at least 60% as much as the starter over the last three games.",
    `Scoring: 4 pt passing TD, 1 pt per 25 pass yds, 1 pt per 10 rush/rec yds, 6 pt rush/rec TD, −2 per INT or fumble lost${f === "ppr" ? ", 1 per catch" : f === "half" ? ", 0.5 per catch" : ""}.`,
    `Data: <a href="https://github.com/nflverse/nflverse-data" target="_blank" rel="noopener">nflverse</a> weekly stats, schedule and depth charts. Click any column header to sort.`,
  ].map(s => `<p>${s}</p>`).join("");
}

function setPos(p) { state.pos = p; state.sort = null; render(); }

function init() {
  if (!DATA) { document.querySelector(".table-box").innerHTML = '<p class="empty">No data yet. Run build.py to generate this week\'s charts.</p>'; return; }
  const upd = new Date(DATA.updated);
  document.getElementById("eyebrow").textContent = `${DATA.season} NFL season · Week ${DATA.week}`;
  document.getElementById("sub").textContent =
    `Defense stats through Week ${DATA.statsThrough}. Updated ${upd.toLocaleDateString(undefined, { month: "short", day: "numeric" })} at ${upd.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}.`;
  document.getElementById("posSeg").innerHTML = POS.map(p => `<button type="button" data-pos="${p}">${p}</button>`).join("");
  document.getElementById("fmtSeg").innerHTML = Object.entries(DATA.formats).map(([k, v]) => `<button type="button" data-fmt="${k}">${v}</button>`).join("");
  document.getElementById("posSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (location.hash !== "#" + b.dataset.pos.toLowerCase()) location.hash = b.dataset.pos.toLowerCase(); else setPos(b.dataset.pos);
  });
  document.getElementById("fmtSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.fmt = b.dataset.fmt; try { localStorage.setItem("mc-fmt", state.fmt); } catch (err) {}
    render();
  });
  document.querySelector("#tbl thead").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const key = b.dataset.key;
    const cur = state.sort || { key: "rank", dir: -1 };
    state.sort = { key, dir: cur.key === key ? -cur.dir : (key === "player" || key === "opp" ? 1 : -1) };
    render();
  });
  document.getElementById("search").addEventListener("input", e => { state.q = e.target.value; render(); });
  if (SHOW_DOWNLOADS) {
    const box = document.getElementById("downloads");
    box.hidden = false;
    for (const label of Object.values(DATA.formats)) {
      const a = document.createElement("a");
      a.href = `Week_${DATA.week}_Matchups_${label.replace(/ /g, "_")}.xlsx`;
      a.textContent = `${label} (.xlsx)`;
      box.appendChild(a);
    }
  }
  const fromHash = () => { const h = location.hash.slice(1).toUpperCase(); setPos(POS.includes(h) ? h : "QB"); };
  window.addEventListener("hashchange", fromHash);
  fromHash();
}
init();
</script>
